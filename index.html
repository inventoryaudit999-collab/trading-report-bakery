<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Trading Report | BAKERY GRP.68,78</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#F8F9FB; --border:#E3E7EF; --border2:#EEF0F5;
  --text:#1A1D23; --soft:#6B7280; --faint:#9CA3AF;
  --blue:#0B5FB4; --blue-d:#084D95; --blue-s:#E7F1FB;
  --amber:#C9742A; --amber-s:#FDF3E6;
  --green:#15966B; --green-s:#E4F5EE;
  --red:#DC3545; --red-s:#FCEAEA;
  --warn:#E8A020; --warn-s:#FDF3DC;
  --shadow1:0 1px 3px rgba(0,0,0,.06); --shadow2:0 4px 16px rgba(0,0,0,.08); --shadow3:0 12px 40px rgba(0,0,0,.12);
  --r6:6px; --r10:10px; --r14:14px; --r20:20px; --rpill:999px;
  --font:'Inter','Noto Sans Thai',sans-serif; --mono:'Roboto Mono','Noto Sans Thai',monospace;
  --sidebar:240px; --topbar:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:var(--blue);text-decoration:none}
.hidden{display:none!important}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#cdd2da;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--r10);border:1px solid transparent;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(11,95,180,.25)}
.btn-primary:hover{background:var(--blue-d)}
.btn-amber{background:var(--amber);color:#fff}
.btn-amber:hover{filter:brightness(.95)}
.btn-ghost{background:transparent;color:var(--soft);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text);border-color:#d0d5de}
.btn-danger{background:var(--red-s);color:var(--red);border-color:transparent}
.btn-danger:hover{background:#f9d5d5}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:var(--r6)}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--r10)}

/* ── LOGIN ── */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(145deg,#063A78 0%,#0B5FB4 50%,#1B82D2 100%);
  position:relative;overflow:hidden;
}
#loginScreen::before{
  content:'';position:absolute;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,116,42,.40) 0%,transparent 70%);
  top:-180px;right:-150px;pointer-events:none;
  animation:blob 18s ease-in-out infinite;
}
#loginScreen::after{
  content:'';position:absolute;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(75,188,255,.25) 0%,transparent 70%);
  bottom:-160px;left:-120px;pointer-events:none;
  animation:blob 22s ease-in-out infinite reverse;
}
@keyframes blob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.08)}}

.login-card{
  position:relative;z-index:2;width:100%;max-width:420px;
  background:rgba(255,255,255,.93);backdrop-filter:blur(20px) saturate(180%);
  border-radius:var(--r20);border:1px solid rgba(255,255,255,.7);
  box-shadow:0 24px 64px rgba(6,58,120,.35);
  padding:36px 32px;
  animation:cardIn .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.login-logo-wrap{
  display:flex;justify-content:center;margin-bottom:20px;
}
.login-logo-box{
  background:#fff;border-radius:var(--r14);padding:10px 24px;
  box-shadow:0 6px 20px rgba(11,95,180,.15);border:1px solid #e8eef7;
}
.login-logo-box img{height:52px;width:auto;display:block}

.login-title{
  text-align:center;margin-bottom:24px;
}
.login-title h1{font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px}
.login-title p{font-size:12.5px;color:var(--soft);line-height:1.5}

.field-group{margin-bottom:14px}
.field-group label{display:block;font-size:12px;font-weight:700;color:var(--soft);margin-bottom:5px}
.field-group input{
  width:100%;padding:11px 13px;border-radius:var(--r10);border:1.5px solid var(--border);
  background:var(--surface2);font-size:15px;color:var(--text);
  transition:border-color .15s,background .15s,box-shadow .15s;
}
.field-group input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px var(--blue-s)}

.login-err{
  display:none;background:var(--red-s);color:var(--red);border-radius:var(--r6);
  padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:12px;
}
.login-foot{text-align:center;margin-top:18px;font-size:11.5px;color:var(--faint)}

/* ── APP SHELL ── */
#app{display:flex;height:100vh;overflow:hidden}

.sidebar{
  width:var(--sidebar);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border2);
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;z-index:40;
}
.sb-brand{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--border2);flex-shrink:0;
}
.sb-brand .mark{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--amber) 0%,#E08B30 100%);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 10px rgba(201,116,42,.30);
}
.sb-brand .info .name{font-weight:800;font-size:13.5px;line-height:1.2}
.sb-brand .info .role{font-size:11.5px;color:var(--soft)}

.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 13px;
  border-radius:var(--r10);color:var(--soft);font-weight:600;font-size:13px;
  cursor:pointer;transition:all .15s;
}
.nav-item .ico{width:20px;text-align:center;font-size:15px;flex-shrink:0}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 4px 14px rgba(11,95,180,.30)}

.sb-foot{padding:12px 14px;border-top:1px solid var(--border2);font-size:11px;color:var(--faint);flex-shrink:0}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  height:var(--topbar);flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border2);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;
  position:relative;z-index:30;
}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-title{font-size:16px;font-weight:800}
.topbar-sub{font-size:11.5px;color:var(--soft);margin-top:1px}
.content{flex:1;overflow-y:auto;padding:20px}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r14);box-shadow:var(--shadow1);padding:18px}
.card+.card{margin-top:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-title{font-size:14.5px;font-weight:800}
.card-title .sub{font-weight:500;color:var(--soft);font-size:12.5px;margin-left:4px}

/* ── STATS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r14);padding:16px 18px;box-shadow:var(--shadow1)}
.kpi-card .lbl{font-size:11.5px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.kpi-card .val{font-size:24px;font-weight:800;font-family:var(--mono)}
.kpi-card .hint{font-size:11.5px;color:var(--faint);margin-top:3px}

/* Hero Card */
.hero-card{
  background:linear-gradient(135deg,#5C2D0E 0%,#8B4513 40%,var(--amber) 100%);
  border-radius:var(--r20);padding:24px 28px;color:#fff;
  box-shadow:0 8px 28px rgba(139,69,19,.30);position:relative;overflow:hidden;
  display:flex;align-items:center;gap:20px;margin-bottom:14px;
}
.hero-card::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06);right:-60px;top:-70px}
.hero-card::after{content:'';position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(11,95,180,.14);left:-40px;bottom:-50px}
.hero-icon{font-size:44px;flex-shrink:0;z-index:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.2))}
.hero-content{z-index:1;flex:1}
.hero-lbl{font-size:12.5px;font-weight:600;opacity:.82;margin-bottom:4px}
.hero-val{font-size:38px;font-weight:800;letter-spacing:-.02em;font-family:var(--mono);line-height:1}
.hero-hint{font-size:12px;opacity:.7;margin-top:4px}
.hero-badge{position:absolute;top:14px;right:18px;z-index:1;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.30);border-radius:var(--rpill);padding:3px 11px;font-size:10.5px;font-weight:800;letter-spacing:.06em}

/* Progress Bar */
.prog-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r14);padding:18px 20px;box-shadow:var(--shadow1);margin-bottom:14px}
.prog-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.prog-title{font-size:14px;font-weight:800}
.prog-sub{font-size:11.5px;color:var(--faint);margin-top:3px}
.prog-pct{font-size:26px;font-weight:800;color:var(--amber);font-family:var(--mono)}
.prog-track{height:10px;border-radius:6px;background:var(--border2);overflow:hidden;margin-bottom:5px}
.prog-fill{height:100%;border-radius:6px;background:var(--amber);transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--rpill);font-size:11px;font-weight:700}
.pill-ok{background:var(--green-s);color:var(--green)}
.pill-warn{background:var(--warn-s);color:var(--warn)}
.pill-no{background:var(--border2);color:var(--soft)}
.pill-info{background:var(--blue-s);color:var(--blue)}
.pill-amber{background:var(--amber-s);color:var(--amber)}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 22px;border-radius:var(--rpill);font-size:13.5px;font-weight:600;box-shadow:var(--shadow3);opacity:0;pointer-events:none;transition:all .25s;z-index:200;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--green)}
#toast.err{background:var(--red)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,32,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:var(--r20);width:100%;max-width:460px;padding:22px;box-shadow:var(--shadow3);max-height:88vh;overflow:auto}
.modal h3{font-size:15.5px;font-weight:800;margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* Table */
.tbl-wrap{overflow:auto;border-radius:var(--r10);border:1px solid var(--border2)}
table.dtbl{width:100%;border-collapse:collapse;font-size:13px}
table.dtbl thead th{position:sticky;top:0;z-index:5;background:var(--surface2);border-bottom:1px solid var(--border);padding:9px 11px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:800;white-space:nowrap;text-align:left}
table.dtbl tbody td{padding:8px 11px;border-bottom:1px solid var(--border2);vertical-align:middle}
table.dtbl tbody tr:hover{background:var(--surface2)}
table.dtbl tbody tr:last-child td{border-bottom:none}
table.dtbl tfoot td{padding:9px 11px;font-weight:800;background:var(--surface2);border-top:2px solid var(--border)}
.code-cell{font-family:var(--mono);font-size:11.5px;color:var(--soft)}
.cls-badge{display:inline-block;background:var(--blue-s);color:var(--blue);border-radius:5px;padding:1px 7px;font-family:var(--mono);font-size:11px;font-weight:700}

/* Entry QTY input */
.qty-inp{
  width:90px;padding:6px 8px;border-radius:7px;border:1.5px solid var(--border);
  background:var(--surface2);font-family:var(--mono);font-size:13px;
  text-align:right;color:var(--text);transition:border-color .15s,background .15s;
}
.qty-inp:focus{outline:none;border-color:var(--blue);background:#fff}
.qty-inp.filled{border-color:var(--amber);background:var(--amber-s);color:var(--amber)}

/* Info bar */
.info-bar{display:flex;align-items:center;justify-content:space-between;background:var(--blue-s);border-radius:var(--r10);padding:10px 16px;margin-bottom:12px;flex-wrap:wrap;gap:8px;font-size:13px}
.info-bar strong{color:var(--blue)}

/* Filter bar */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap input{width:100%;padding:8px 11px 8px 34px;border-radius:var(--r6);border:1.5px solid var(--border);background:var(--surface2);font-size:13.5px;color:var(--text)}
.search-wrap input:focus{outline:none;border-color:var(--blue);background:#fff}
.search-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--faint);pointer-events:none}

/* Dropdown class filter */
.cls-select{padding:8px 11px;border-radius:var(--r6);border:1.5px solid var(--border);background:var(--surface2);font-size:13px;color:var(--text);min-width:160px;cursor:pointer}
.cls-select:focus{outline:none;border-color:var(--blue)}

/* Date picker */
.date-inp{padding:8px 11px;border-radius:var(--r6);border:1.5px solid var(--border);background:var(--surface2);font-size:13px;color:var(--text);cursor:pointer}
.date-inp:focus{outline:none;border-color:var(--blue)}

/* Dirty badge */
.dirty-badge{display:none;align-items:center;gap:5px;background:var(--warn-s);color:var(--warn);border-radius:var(--rpill);padding:4px 12px;font-size:12px;font-weight:700}
.dirty-badge.show{display:flex}

/* Mobile */
.menu-btn{display:none}
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
.sb-backdrop.show{display:block}

/* Utility */
.num{font-family:var(--mono)}
.tr{text-align:right}
.tc{text-align:center}
.bold{font-weight:800}
.muted{color:var(--soft)}
.w100{width:100%}
.flex{display:flex}.gap8{gap:8px}.gap12{gap:12px}.items-c{align-items:center}.justify-b{justify-content:space-between}.flex-1{flex:1}
.mt8{margin-top:8px}.mt14{margin-top:14px}.mt20{margin-top:20px}
mark.hl{background:#FFF3CD;border-radius:2px;padding:0 1px}

/* tbl-wrap max height for entry */
.entry-tbl-wrap{max-height:58vh}

@media(max-width:900px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow3);z-index:40}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-btn{display:flex}
  .hero-card{padding:18px 16px}
  .hero-val{font-size:28px}
  .hero-icon{font-size:32px}
  .kpi-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:540px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .login-card{padding:26px 20px}
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="login-logo-box">
        <img id="makroLogo" alt="Makro">
      </div>
    </div>
    <div class="login-title">
      <h1>Trading Report</h1>
      <p>BAKERY GRP.68,78 &mdash; ระบบบันทึกการตรวจนับสต็อก</p>
    </div>
    <div class="login-err" id="loginErr">ชื่อผู้ใช้ หรือ รหัสผ่าน ไม่ถูกต้อง</div>
    <form id="loginForm" autocomplete="off">
      <div class="field-group">
        <label for="fUser">รหัสผู้ใช้งาน (Username)</label>
        <input type="text" id="fUser" placeholder="กรอกรหัสผู้ใช้งาน" required>
      </div>
      <div class="field-group">
        <label for="fPass">รหัสผ่าน (Password)</label>
        <input type="password" id="fPass" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w100" style="padding:13px;font-size:15px;">เข้าสู่ระบบ</button>
    </form>
    <div class="login-foot">CP Axtra &mdash; Store Operations &middot; Trading Report BAKERY</div>
  </div>
</div>

<!-- ══════════════ APP SHELL ══════════════ -->
<div id="app" class="hidden">
  <div class="sb-backdrop" id="sbBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="mark">🥐</div>
      <div class="info">
        <div class="name" id="sbName">&nbsp;</div>
        <div class="role" id="sbRole">&nbsp;</div>
      </div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">Trading Report BAKERY<br>GRP.68,78 · CP Axtra</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn btn-ghost btn-icon menu-btn" id="menuBtn">&#9776;</button>
        <div>
          <div class="topbar-title" id="tbTitle">&nbsp;</div>
          <div class="topbar-sub" id="tbSub">&nbsp;</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">ออกจากระบบ</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script>
// ══════════════════════════════════

function p2(n){ return String(n).padStart(2,'0'); }
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}
function thDate(s){
  if(!s) return '-';
  const [y,m,d]=s.split('-');
  return `${d}/${m}/${y}`;
}
function fNum(n,dec=0){ return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function esc(s){ if(s==null)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hlText(t,q){
  if(!q) return t;
  return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark class="hl">$1</mark>');
}

let _toastTimer=null;
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='show'+(type?' '+type:'');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.className='',3200);
}
function showModal(html,onMount){
  const r=document.getElementById('modalRoot');
  r.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal">${html}</div></div>`;
  document.getElementById('mbg').addEventListener('click',e=>{ if(e.target.id==='mbg') closeModal(); });
  if(onMount) onMount(r);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function setBtn(btn,loading,txt='...'){
  if(!btn) return;
  if(loading){ btn._orig=btn.innerHTML; btn.innerHTML=txt; btn.disabled=true; }
  else { if(btn._orig) btn.innerHTML=btn._orig; btn.disabled=false; }
}

async function dbGet(path){ if(!fbOk) return null; const s=await db.ref(path).once('value'); return s.val(); }
async function dbSet(path,val){ if(!fbOk) return; await db.ref(path).set(val); }
async function dbUpdate(obj){ if(!fbOk) return; await db.ref().update(obj); }
async function dbRemove(path){ if(!fbOk) return; await db.ref(path).remove(); }

function initLogin(){
  document.getElementById('loginForm').addEventListener('submit',e=>{
    e.preventDefault();
    const u=document.getElementById('fUser').value.trim().toLowerCase();
    const p=document.getElementById('fPass').value;
    const errEl=document.getElementById('loginErr');

    if(u===ADMIN.u && p===ADMIN.p){
      SES={role:'admin',name:ADMIN.name}; saveSes(SES); startApp(); return;
    }
    const store=STORES.find(s=>s.u===u&&s.p===p);
    if(store){
      SES={role:'store',no:store.n,name:store.name,u:store.u}; saveSes(SES); startApp(); return;
    }
    errEl.style.display='block';
    setTimeout(()=>errEl.style.display='none',3000);
  });
  document.getElementById('logoutBtn').addEventListener('click',()=>{
    clearSes(); SES=null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('fUser').value='';
    document.getElementById('fPass').value='';
  });
}

function startApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  if(SES.role==='store'){
    document.getElementById('sbName').textContent=`${SES.no} - ${SES.name}`;
    document.getElementById('sbRole').textContent='บัญชีสาขา';
  } else {
    document.getElementById('sbName').textContent=SES.name;
    document.getElementById('sbRole').textContent='ผู้ดูแลระบบ';
  }
  buildNav(); go('dashboard');
}

function buildEntryView(C){

          <input type="date" class="date-inp" id="entryDate" value="${ENTRY_DATE}" onchange="onDateChange(this.value)">

        <div>
          <label style="font-size:11.5px;font-weight:700;color:var(--soft);display:block;margin-bottom:4px;">🏷️ หมวดหมู่ Class</label>
          <select class="cls-select" id="clsSelect" onchange="onClsChange(this.value)">${clsOpts}</select>
        </div>
        <div class="flex-1">
          <label style="font-size:11.5px;font-weight:700;color:var(--soft);display:block;margin-bottom:4px;">🔍 ค้นหา</label>
          <div class="search-wrap">
            <span class="search-ico">🔍</span>
            <input type="text" id="searchInp" placeholder="ชื่อสินค้า หรือ รหัส..." value="${esc(SEARCH_Q)}" oninput="onSearch(this.value)">

          <thead>

              <th style="width:70px">Class</th>
              <th style="width:105px">รหัส</th>
              <th>ชื่อสินค้า</th>

}

function buildEntryRows(items){
  if(!items.length) return `<tr><td colspan="5" class="tc muted" style="padding:24px;">ไม่พบรายการ</td></tr>`;
  return items.map((it,idx)=>{
    const v=ENTRY_DATA[it.code]!==undefined&&ENTRY_DATA[it.code]!==null?ENTRY_DATA[it.code]:'';
    const filled=v!=='';
    const nameTxt=SEARCH_Q?hlText(esc(it.name),SEARCH_Q):esc(it.name);
    return `<tr>
      <td class="code-cell">${it.no}</td>
      <td><span class="cls-badge">${esc(it.class)}</span></td>
      <td class="code-cell">${esc(it.code)}</td>
      <td style="max-width:340px;white-space:normal;line-height:1.3">${nameTxt}</td>
      <td class="tr">
        <input class="qty-inp${filled?' filled':''}" type="number" min="0" step="0.01"
          id="q_${esc(it.code)}" value="${esc(String(v))}"
          onchange="onQty('${esc(it.code)}',this.value)"
          onkeydown="navRow(event,${idx})"
          data-idx="${idx}">
      </td>
    </tr>`;
  }).join('');
}

function refreshEntryBody(){
  const items=filteredItems();
  const tbody=document.getElementById('entryBody');
  if(tbody) tbody.innerHTML=buildEntryRows(items);
  const filledAll=ITEMS_DATA.filter(i=>ENTRY_DATA[i.code]!==null&&ENTRY_DATA[i.code]!==undefined&&ENTRY_DATA[i.code]!=='').length;
  const filledView=items.filter(i=>ENTRY_DATA[i.code]!==null&&ENTRY_DATA[i.code]!==undefined&&ENTRY_DATA[i.code]!=='').length;
  const totalQty=items.reduce((s,i)=>s+(parseFloat(ENTRY_DATA[i.code])||0),0);
  const ib=document.querySelector('.info-bar span');
  if(ib) ib.innerHTML=`วันที่ <strong>${thDate(ENTRY_DATE)}</strong> &nbsp;·&nbsp; กรอกแล้ว <strong>${filledView}</strong> / ${items.length} รายการที่แสดง &nbsp;·&nbsp; ทั้งหมด <strong>${filledAll}</strong> / ${ITEMS_DATA.length}`;
  const tq=document.getElementById('totalQty');
  if(tq) tq.textContent=fNum(totalQty,2);
}

async function onDateChange(val){
  ENTRY_DATE=val;
  const C=document.getElementById('content');
  C.innerHTML='<div class="card tc" style="padding:32px;">⏳ กำลังโหลดข้อมูล...</div>';
  const data=await dbGet(`entries/${SES.no}/${ENTRY_DATE}`) || {};
  ENTRY_DATA={...data}; DIRTY=false;
  buildEntryView(C);
}
function onClsChange(v){ CLS_FILTER=v; refreshEntryBody(); }
function onSearch(v){ SEARCH_Q=v.trim(); refreshEntryBody(); }

function onQty(code,val){
  ENTRY_DATA[code]=val===''?'':parseFloat(val)||0;
  DIRTY=true;
  const inp=document.getElementById(`q_${code}`);
  if(inp) inp.classList.toggle('filled',val!=='');
  const db=document.getElementById('dirtyBadge');
  if(db) db.className='dirty-badge show';
  refreshFooter();
}
function refreshFooter(){
  const items=filteredItems();
  const tq=document.getElementById('totalQty');
  if(tq) tq.textContent=fNum(items.reduce((s,i)=>s+(parseFloat(ENTRY_DATA[i.code])||0),0),2);
}
function navRow(e,idx){
  const items=filteredItems();
  if(e.key==='Enter'||e.key==='ArrowDown'){ e.preventDefault(); const n=document.getElementById(`q_${items[idx+1]?.code}`); if(n)n.focus(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); const p=document.getElementById(`q_${items[idx-1]?.code}`); if(p)p.focus(); }
}

function clearAllQty(){
  showModal(`<h3>🗑️ ล้างข้อมูลวันนี้</h3><p>ต้องการล้าง QTY ทั้งหมดของวันที่ ${thDate(ENTRY_DATE)} ใช่หรือไม่?</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="confirmClear()">ล้างข้อมูล</button></div>`);

function confirmClear(){
  ITEMS_DATA.forEach(i=>{ ENTRY_DATA[i.code]=''; }); DIRTY=true; closeModal(); refreshEntryBody(); toast('ล้างข้อมูลแล้ว');

async function saveEntry(){
  const btn=document.getElementById('saveBtn');

  const updates={};
  ITEMS_DATA.forEach(i=>{
    const v=ENTRY_DATA[i.code];

async function exportAllStores(){
  toast('กำลังสร้าง Excel...');
  const allE=await dbGet('entries') || {};
  const dates=new Set();
  Object.values(allE).forEach(s=>Object.keys(s||{}).forEach(d=>dates.add(d)));
  const sorted=[...dates].sort();
  const wb=XLSX.utils.book_new();
  STORES.slice(0,50).forEach(store=>{
    const sd=allE[store.n]||{};
    if(!Object.keys(sd).length) return;
    const rows=[['ลำดับ','Class','รหัส','ชื่อสินค้า',...sorted.map(d=>thDate(d))]];
    ITEMS_DATA.forEach(i=>{ rows.push([i.no,i.class,i.code,i.name,...sorted.map(d=>{ const v=(sd[d]||{})[i.code]; return v!=null&&v!==''?Number(v):''; })]); });

    XLSX.utils.book_append_sheet(wb,ws,`ST${store.n}`.substring(0,31));
  });
  XLSX.writeFile(wb,`BakeryStock_All_${todayStr()}.xlsx`);

async function doRangeExport(){
  const from=document.getElementById('expFrom').value;
  const to=document.getElementById('expTo').value;
  if(!from||!to){ toast('กรุณาเลือกช่วงวันที่','err'); return; }
  toast('กำลังสร้าง Excel...');
  const allE=await dbGet('entries') || {};
  const wb=XLSX.utils.book_new();
  const rows=[['สาขา','ชื่อ','วันที่','รายการที่กรอก','รวม QTY']];
  STORES.forEach(s=>{
    const sd=allE[s.n]||{};
    Object.keys(sd).filter(d=>d>=from&&d<=to).sort().forEach(d=>{
      const dd=sd[d]||{};
      const f=Object.values(dd).filter(v=>v!==null&&v!=='').length;
      const q=Object.values(dd).reduce((sum,v)=>sum+(parseFloat(v)||0),0);
      rows.push([s.n,s.name,thDate(d),f,q]);
    });
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb,ws,'Summary');
  XLSX.writeFile(wb,`BakeryStock_${from}_${to}.xlsx`);
  toast('Export สำเร็จ ✅','ok');
}

//  CLEAR ALL
// ══════════════════════════════════
function renderClearAll(){
  setTopbar('ล้างข้อมูล','⚠️ อันตราย');
  document.getElementById('content').innerHTML=`
    <div class="card" style="border-color:var(--red-s)">
      <div class="card-head"><div class="card-title" style="color:var(--red)">🗑️ ล้างข้อมูลทั้งหมด</div></div>
      <p style="margin-bottom:14px">การดำเนินการนี้จะลบข้อมูลการตรวจนับทั้งหมดออกจาก Firebase อย่างถาวร ไม่สามารถกู้คืนได้</p>
      <button class="btn btn-danger" onclick="confirmClearAll()">🗑️ ล้างข้อมูลทั้งหมด</button>
    </div>`;
}
function confirmClearAll(){
  showModal(`<h3 style="color:var(--red)">⚠️ ยืนยันการล้างข้อมูล</h3>
    <p>ข้อมูลทั้งหมดจะถูกลบถาวร กรุณาพิมพ์ <b>DELETE</b> เพื่อยืนยัน</p>
    <input type="text" id="confInp" class="date-inp" style="width:100%;margin-top:10px" placeholder="พิมพ์ DELETE">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-danger" onclick="doClearAll()">ลบทั้งหมด</button>
    </div>`);
}
async function doClearAll(){
  if(document.getElementById('confInp').value.trim()!=='DELETE'){ toast('พิมพ์ DELETE ให้ถูกต้อง','err'); return; }
  try{ await dbRemove('entries'); await dbRemove('logs'); closeModal(); toast('ล้างข้อมูลแล้ว','ok'); }
  catch(e){ toast('Error: '+e.message,'err'); }
}
